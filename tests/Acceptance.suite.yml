actor: AcceptanceTester
modules:
    enabled:
        - WebDriver:
            url: http://livret-alternant-php-1:80
            host: selenium
            browser: chrome
            window_size: 1920x1080
            capabilities:
                goog:chromeOptions:
                    args: ["--lang=fr"]
        - Db:
            dsn: 'mysql:host=database;port=3306;dbname=app_test'
            user: app
            password: password

# Add Codeception\Step\Retry trait to AcceptanceTester to enable retries
step_decorators:
    - Codeception\Step\ConditionalAssertion
    - Codeception\Step\TryTo
    - Codeception\Step\Retry